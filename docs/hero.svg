<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Azul vs AI</title>
  <desc id="description">Colorful Azul tiles on a dark blue game table.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101d36"/>
      <stop offset="1" stop-color="#244673"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#5681b3" stop-opacity=".42"/>
      <stop offset="1" stop-color="#5681b3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#ffe195"/>
      <stop offset="1" stop-color="#d99b27"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#071225" flood-opacity=".5"/>
    </filter>
    <symbol id="blue" viewBox="0 0 74 74">
      <rect x="2" y="2" width="70" height="70" rx="12" fill="#2870ce" stroke="#7bb2f3" stroke-width="3"/>
      <path d="M37 14 60 37 37 60 14 37Z" fill="none" stroke="#e1f1ff" stroke-width="4"/>
      <path d="M37 25 49 37 37 49 25 37Z" fill="#85b7f1"/>
    </symbol>
    <symbol id="yellow" viewBox="0 0 74 74">
      <rect x="2" y="2" width="70" height="70" rx="12" fill="#efb32e" stroke="#ffdb78" stroke-width="3"/>
      <circle cx="37" cy="37" r="23" fill="none" stroke="#a75d18" stroke-width="5"/>
      <circle cx="37" cy="37" r="8" fill="#ffe89d"/>
    </symbol>
    <symbol id="red" viewBox="0 0 74 74">
      <rect x="2" y="2" width="70" height="70" rx="12" fill="#c8493e" stroke="#f08d7b" stroke-width="3"/>
      <path d="M37 11 63 37 37 63 11 37Z" fill="#f2b28d"/>
      <path d="M37 25 49 37 37 49 25 37Z" fill="#c8493e"/>
    </symbol>
    <symbol id="black" viewBox="0 0 74 74">
      <rect x="2" y="2" width="70" height="70" rx="12" fill="#252d3e" stroke="#788397" stroke-width="3"/>
      <path d="M14 37h46M37 14v46" stroke="#69d0cb" stroke-width="6"/>
    </symbol>
    <symbol id="white" viewBox="0 0 74 74">
      <rect x="2" y="2" width="70" height="70" rx="12" fill="#e7f1f7" stroke="#ffffff" stroke-width="3"/>
      <path d="M18 56 56 18M18 18l38 38" stroke="#4b88c4" stroke-width="8"/>
    </symbol>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#background)"/>
  <circle cx="930" cy="180" r="280" fill="url(#glow)"/>
  <path d="M0 304c232-84 417-40 582 56M754 0c157 137 298 124 446 36" fill="none" stroke="#88add4" stroke-opacity=".12" stroke-width="2"/>
  <g fill="none" stroke="#e8c46c" stroke-opacity=".35">
    <rect x="43" y="42" width="1114" height="276" rx="14"/>
    <rect x="52" y="51" width="1096" height="258" rx="10"/>
  </g>
  <text x="92" y="157" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="14">AZUL</text>
  <text x="94" y="203" fill="#e2eaf4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="8">VS AI</text>
  <path d="M93 224h290" stroke="#e8bd58" stroke-width="3"/>
  <text x="94" y="265" fill="#bfcce0" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="1">A colorful duel of strategy and tiles</text>
  <g filter="url(#shadow)">
    <use href="#blue" x="660" y="92" width="82" height="82" transform="rotate(-12 701 133)"/>
    <use href="#yellow" x="754" y="71" width="82" height="82" transform="rotate(8 795 112)"/>
    <use href="#red" x="850" y="91" width="82" height="82" transform="rotate(-4 891 132)"/>
    <use href="#black" x="946" y="70" width="82" height="82" transform="rotate(12 987 111)"/>
    <use href="#white" x="729" y="171" width="82" height="82" transform="rotate(-5 770 212)"/>
    <use href="#blue" x="824" y="186" width="82" height="82" transform="rotate(9 865 227)"/>
    <use href="#yellow" x="920" y="172" width="82" height="82" transform="rotate(-9 961 213)"/>
    <use href="#red" x="1013" y="154" width="82" height="82" transform="rotate(7 1054 195)"/>
  </g>
</svg>
